<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panorama 360° – cameră și hol</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
html,body,#panorama{height:100%;margin:0;background:#111}
.pnlm-load-box,.pnlm-loader{display:none!important}
</style>
<link rel="stylesheet" href="brand-tour.css">

<div id="panorama"></div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="brand-tour.js?v=20260930-2"></script>
<script>
const savedTourView = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem('tour-last-view'));
    if (saved && ['intrare', 'curte', 'receptie', 'camera', 'hol'].includes(saved.scene) &&
        Number.isFinite(saved.pitch) && Number.isFinite(saved.yaw)) return saved;
    const scene = localStorage.getItem('tour-last-scene');
    if (['intrare', 'curte', 'receptie', 'camera', 'hol'].includes(scene)) return { scene };
  } catch (_) {}
  return { scene: 'intrare' };
})();
const preload = [
  'intrare_360_street_logo_repaired.jpg',
  'curte_360_harmonized_v2.jpg',
  'receptie_360_harmonized.jpg',
  'room_360_ai_filled.png',
  'hol_360_equirectangular.jpg'
].map(src => { const image = new Image(); image.src = src; return image; });
const tourConfig = {
  default: {
    firstScene: savedTourView.scene, autoLoad: true,
    hfov: 110, minHfov: 110, maxHfov: 110,
    compass: false, showZoomCtrl: false, mouseZoom: false, keyboardZoom: false
  },
  scenes: {
    intrare: {
      title: 'Intrare',
      yaw: 0,
      type: 'equirectangular',
      panorama: 'intrare_360_street_logo_repaired.jpg',
      hotSpots: [{
        pitch: -8, yaw: 0, type: 'custom', cssClass: 'duck-hotspot',
        createTooltipFunc: window.makeDuckDoor,
        createTooltipArgs: { scene: 'curte', label: 'Spre curte' }
      }]
    },
    curte: {
      title: 'Curte',
      yaw: 0,
      type: 'equirectangular',
      panorama: 'curte_360_harmonized_v2.jpg',
      hotSpots: [
        {
          pitch: -8, yaw: -35, type: 'custom', cssClass: 'duck-hotspot',
          createTooltipFunc: window.makeDuckDoor,
          createTooltipArgs: { scene: 'intrare', label: 'Spre stradă' }
        },
        {
          pitch: -8, yaw: 158, type: 'custom', cssClass: 'duck-hotspot',
          createTooltipFunc: window.makeDuckDoor,
          createTooltipArgs: { scene: 'receptie', label: 'Spre recepție' }
        }
      ]
    },
    receptie: {
      title: 'Recepție',
      yaw: 0,
      type: 'equirectangular',
      panorama: 'receptie_360_harmonized.jpg',
      hotSpots: [{
        pitch: -8, yaw: 0, type: 'custom', cssClass: 'duck-hotspot',
        createTooltipFunc: window.makeDuckDoor,
        createTooltipArgs: { scene: 'curte', label: 'Spre curte' }
      }]
    },
    camera: {
      title: 'Camera',
      yaw: -45,
      type: 'equirectangular',
      panorama: 'room_360_ai_filled.png',
      hotSpots: [{
        pitch: -10, yaw: 0, type: 'custom', cssClass: 'duck-hotspot',
        createTooltipFunc: window.makeDuckDoor,
        createTooltipArgs: { scene: 'hol', label: 'Spre hol' }
      }]
    },
    hol: {
      title: 'Hol',
      type: 'equirectangular',
      panorama: 'hol_360_equirectangular.jpg',
      hotSpots: [{
        pitch: -10, yaw: -22, type: 'custom', cssClass: 'duck-hotspot',
        createTooltipFunc: window.makeDuckDoor,
        createTooltipArgs: { scene: 'camera', label: 'Spre cameră' }
      }]
    }
  }
};
if (Number.isFinite(savedTourView.pitch) && Number.isFinite(savedTourView.yaw)) {
  tourConfig.scenes[savedTourView.scene].pitch = savedTourView.pitch;
  tourConfig.scenes[savedTourView.scene].yaw = savedTourView.yaw;
}
const viewer = pannellum.viewer('panorama', tourConfig);
window.tourViewer = viewer;
</script>
